# SPDX-License-Identifier: MIT
# Builds everything the guest needs and packs it into the installer (venera-setup-<version>-<arch>.exe), as README's build
# steps do, and puts it on a disc image (.iso) as well. A tag v<x.y.z> also publishes both as a release; the tag has to match the project's VERSION
# (CMakeLists.txt), to which the build appends the commit count and hash.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test build, SDK extraction and trace clocks
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test package and update architecture selection
        run: |
          cmake -S tests/host -B build/host -G Ninja
          cmake --build build/host
          ctest --test-dir build/host --output-on-failure

  windows-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
          - runner: windows-11-arm
            arch: ARM64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build native Windows context and clock tests
        run: |
          cmake -S tests/windows-architecture -B build/windows-tests -A ${{ matrix.arch }}
          cmake --build build/windows-tests --config Debug
      - name: Run native Windows context and clock tests
        run: ctest --test-dir build/windows-tests -C Debug --output-on-failure

  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.compile.outputs.version }}
    env:
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # the commit count is part of the version

      - uses: cachix/install-nix-action@v31

      - name: Cache the WDK and SDK headers
        uses: actions/cache@v4
        with:
          path: refs/winkits
          key: winkits-${{ matrix.arch }}-${{ hashFiles('cmake/fetch-winkits.sh') }}

      - name: Fetch the WDK and SDK headers
        run: cmake/fetch-winkits.sh refs/winkits ${{ matrix.arch }}

      # The dev shell's ccache wraps the MinGW compilers (Mesa, DXVK, vkd3d-proton, the UMDs). A cache is saved per
      # commit and the newest one restored, so pull requests start from main's.
      - name: Cache the compiler output
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.arch }}-

      - name: Prepare the dev shell
        run: nix develop -c ccache -z

      - name: Build the Venus ICD and the OpenGL driver
        run: nix develop -c icd/build.sh build/icd ${{ matrix.arch }}

      # The kernel takes any signature in test mode: a throwaway certificate per build.
      - name: Build the KMD
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj "/CN=Venera CI test signing" \
            -addext extendedKeyUsage=codeSigning -keyout "$RUNNER_TEMP/kmd.key" -out "$RUNNER_TEMP/kmd.crt"
          openssl pkcs12 -export -passout pass: -inkey "$RUNNER_TEMP/kmd.key" -in "$RUNNER_TEMP/kmd.crt" \
            -out "$RUNNER_TEMP/kmd.pfx"
          nix develop -c sh -c "cmake -S kmd -B build/kmd -G Ninja -DCMAKE_TOOLCHAIN_FILE=$PWD/cmake/clang-cl-kmd.cmake \
            -DVENERA_TARGET_ARCH=${{ matrix.arch }} -DVENERA_KMD_SIGN_PFX=$RUNNER_TEMP/kmd.pfx && ninja -C build/kmd"

      - name: Build the UMDs, the services and the installer
        id: compile
        run: |
          # A tag's build is a release build; any other a develop build.
          release=${{ startsWith(github.ref, 'refs/tags/v') && 'ON' || 'OFF' }}
          toolchain=cmake/mingw-w64.cmake
          if [ "${{ matrix.arch }}" = arm64 ]; then toolchain=cmake/llvm-mingw-arm64.cmake; fi
          nix develop -c sh -c "cmake -S . -B build/win -G Ninja -DCMAKE_TOOLCHAIN_FILE=$toolchain \
            -DVENERA_RELEASE=$release && cmake --build build/win"
          version=$(cat build/win/setup/version.txt)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cp build/win/setup/venera-setup.exe "venera-setup-$version-${{ matrix.arch }}.exe"

      # The installer on a disc image, to attach to a VM as a CD-ROM. Joliet for the names Windows shows.
      - name: Wrap the installer in an ISO
        run: |
          nix develop -c xorriso -as mkisofs -J -joliet-long -R -V VENERA \
            -o "venera-setup-$VERSION-${{ matrix.arch }}.iso" "venera-setup-$VERSION-${{ matrix.arch }}.exe"

      - name: Compiler cache statistics
        if: always()
        run: nix develop -c ccache -s

      - uses: actions/upload-artifact@v4
        with:
          name: venera-setup-${{ env.VERSION }}-${{ matrix.arch }}
          path: |
            venera-setup-${{ env.VERSION }}-${{ matrix.arch }}.exe
            venera-setup-${{ env.VERSION }}-${{ matrix.arch }}.iso

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, checks, windows-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: venera-setup-*
          merge-multiple: true
      - name: Release both architectures
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          case "$VERSION" in "${GITHUB_REF_NAME#v}".*) ;; *)
            echo "Tag $GITHUB_REF_NAME does not match the version $VERSION"; exit 1 ;; esac
          # The notes are the body of the tagged commit's message (everything after the subject line). GitHub keeps its
          # line breaks, and a wrapped line starting with "11." would begin a list, so each paragraph or list item is
          # joined onto one line. A line starts a new one after a blank line or heading, or with a bullet, quote or
          # table row, or with a number when the block is a numbered list; code fences are kept as they are.
          git log -1 --format=%b HEAD | awk '
            /^```/ { if (cur != "") print cur; cur = ""; fence = !fence; print; next }
            fence { print; next }
            /^[[:space:]]*$/ { if (cur != "") print cur; cur = ""; print; next }
            {
              line = $0; sub(/^[[:space:]]+/, "", line)
              item = line ~ /^([-*+] |>|\|)/; num = line ~ /^[0-9]+[.)] /
              if (cur == "" || item || (num && ordered)) {
                if (cur != "") print cur
                cur = $0; ordered = num
              } else
                cur = cur " " line
              if (line ~ /^#/) { print cur; cur = "" }
            }
            END { if (cur != "") print cur }
          ' > notes.md
          gh release create "$GITHUB_REF_NAME" venera-setup-*.exe venera-setup-*.iso \
            --title "Venera $VERSION" --notes-file notes.md
